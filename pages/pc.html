<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        /* 共通ベーススタイル */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        /* メインコンテナ */
        .main-container {
            display: flex;
            gap: 0;
            align-items: stretch;
            width: 100vw;
            height: 70vh;
        }
        .camera-area, .borrowed-list-area {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
        }
        /* カメラエリア */
        .camera-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #f7f7f7;
            padding: 20px;
        }
        /* 貸し出し中リストエリア */
        .borrowed-list-area {
            background: #f7f7f7;
            padding: 20px;
            max-width: none;
            border-left: 1px solid #e0e0e0;
        }
        /* ボタンのスタイル */
        button {
            padding: 10px 20px;
            margin: 10px auto;
            display: block;
            border: none;
            border-radius: 4px;
            background: #0078d7;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        /* QRコードスキャナのスタイル */
        #qr-video {
            width: 100%;
            max-width: 480px;
            height: auto;
            display: none;
            transform: scaleX(-1); /* 左右反転 */
        }
        #qr-canvas {
            display: none;
            position: absolute;
            left: -9999px;
        }
        /* 結果表示 */
        #result {
            text-align: center;
            margin-top: 20px;
        }
        /* 貸し出し中デバイスリストのスタイル */
        #borrowed-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        #borrowed-list li {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin: 10px 0;
            padding: 10px;
            text-align: center;
            border-left: 4px solid #ff6b6b;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #0078d7;
            padding-bottom: 5px;
        }
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                width: 100vw;
                height: auto;
            }
            .camera-area, .borrowed-list-area {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <h1>QR Manager</h1>
    
    <div class="main-container">
        <div class="camera-area">
            <video id="qr-video"></video>
            <canvas id="qr-canvas" width="320" height="240"></canvas>
            <div id="result">QRコードを読み取らせてください</div>
            <button onclick="location.href='/pages/picture_list.html'">貸し出し中のデバイスを画像で閲覧</button>
        </div>
        
        <div class="borrowed-list-area">
            <h2>貸し出し中のデバイス</h2>
            <ul id="borrowed-list">
                <!-- 貸し出し中のデバイスがここに表示される -->
            </ul>
        </div>
    </div>

    <script src="/static/js/camera.js"></script>
    <script>
        const socket = io('https://' + document.domain + ':' + location.port, {
            transports: ['websocket'],
            secure: true,           // 自己署名証明書の場合のみ。運用時は削除してください。
            rejectUnauthorized: false, // 自己署名証明書の場合のみ。運用時は削除してください。
            timeout: 10000
        });

        socket.on('connect', function() {
            console.log("Connected to Socket.IO server");
        });

        // 通知のタイマーIDを保存する変数
        let noticeTimeoutId = null;

        socket.on('update', function(data) {
            const resultDiv = document.getElementById('result');
            // 未登録デバイスの場合
            if (data.status === 'not_found' || !data.device) {
            resultDiv.innerHTML = 'このデバイスは登録されていません。';
            playSound('../sound/Alarm.mp3');
            // 通知表示
            const borrowedListArea = document.querySelector('.borrowed-list-area');
            let notice = document.getElementById('borrowed-update-notice');
            
            // 既存のタイマーをクリア
            if (noticeTimeoutId) {
                clearTimeout(noticeTimeoutId);
            }
            
            if (!notice) {
                notice = document.createElement('div');
                notice.id = 'borrowed-update-notice';
                notice.style.background = '#ffeaea';
                notice.style.color = '#c00';
                notice.style.padding = '8px 12px';
                notice.style.marginBottom = '10px';
                notice.style.borderRadius = '6px';
                notice.style.textAlign = 'center';
                borrowedListArea.insertBefore(notice, borrowedListArea.firstChild.nextSibling);
            }
            notice.textContent = '未登録のデバイスです';
            
            // 新しいタイマーを設定
            noticeTimeoutId = setTimeout(() => {
                if (notice) notice.remove();
                noticeTimeoutId = null;
                resultDiv.innerHTML = 'QRコードを読み取らせてください';
            }, 3000);
            return;
            }
            // デバイス名とステータスを取得
            const deviceName = data.device && data.device.ID ? data.device.ID : 'デバイス';
            const statusText = data.device && data.device.borrowed ? '貸し出しました' : '返却しました';

            resultDiv.innerHTML = `${deviceName}を${statusText}`;
            updateDeviceList();
            // サウンド再生（パスを修正）
            const soundPath = data.device && data.device.borrowed ? '../sound/Beep01.mp3' : '../sound/Beep02.mp3';
            playSound(soundPath);

            // 貸出中リストの上に通知を表示
            const borrowedListArea = document.querySelector('.borrowed-list-area');
            let notice = document.getElementById('borrowed-update-notice');
            
            // 既存のタイマーをクリア
            if (noticeTimeoutId) {
                clearTimeout(noticeTimeoutId);
            }
            
            if (!notice) {
            notice = document.createElement('div');
            notice.id = 'borrowed-update-notice';
            notice.style.background = '#e3f7e3';
            notice.style.color = '#007800';
            notice.style.padding = '8px 12px';
            notice.style.marginBottom = '10px';
            notice.style.borderRadius = '6px';
            notice.style.textAlign = 'center';
            borrowedListArea.insertBefore(notice, borrowedListArea.firstChild.nextSibling);
            }
            notice.textContent = `${deviceName}を${statusText}`;
            
            // 新しいタイマーを設定（3秒タイマーをリセット）
            noticeTimeoutId = setTimeout(() => {
            if (notice) notice.remove();
            noticeTimeoutId = null;
            resultDiv.innerHTML = 'QRコードを読み取らせてください';
            }, 3000);
        });

        // サーバからの一括更新イベント
        socket.on('update_all', function(data) {
            updateBorrowedList(data.devices);
        });

        function scanQR() {
            fetch('/scan', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById('result');
                    if (data.status === 'エラー') {
                        resultDiv.innerHTML = 'QRコードのスキャンに失敗しました。';
                    } else if (data.status === '未登録') {
                        resultDiv.innerHTML = 'このデバイスは登録されていません。';
                    } else {
                        resultDiv.innerHTML = `デバイスID: ${data.device.ID} - ステータス: ${data.status}`;
                        updateDeviceList();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerHTML = 'エラーが発生しました。';
                });
        }

        function updateDeviceList() {
            fetch('/devices')
                .then(response => response.json())
                .then(devices => {
                    updateBorrowedList(devices);
                });
        }

        // 貸し出し中のデバイスのみを表示する関数
        function updateBorrowedList(devices) {
            const borrowedList = document.getElementById('borrowed-list');
            borrowedList.innerHTML = '';
            
            const borrowedDevices = devices.filter(device => device.borrowed);
            
            if (borrowedDevices.length === 0) {
                const listItem = document.createElement('li');
                listItem.innerHTML = '現在貸し出し中のデバイスはありません';
                listItem.style.fontStyle = 'italic';
                listItem.style.color = '#666';
                borrowedList.appendChild(listItem);
            } else {
                borrowedDevices.forEach(device => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `${device.ID} - ${device.voltage}V`;
                    borrowedList.appendChild(listItem);
                });
            }
        }

        // QRコードスキャナの起動（常時カメラON＆自動スキャン）
        let videoStream = null;
        let scanning = false;

        function startQRScanner() {
            if (scanning) return; // すでにスキャン中なら何もしない
            scanning = true;
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-canvas');
            const context = canvas.getContext('2d');
            const resultDiv = document.getElementById('result');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function (stream) {
                    videoStream = stream;
                    video.style.display = 'block';
                    canvas.style.display = 'block';
                    video.srcObject = stream;
                    video.setAttribute('playsinline', true);
                    video.play();
                    requestAnimationFrame(tick);
                })
                .catch(function (error) {
                    console.error('カメラへのアクセスに失敗しました:', error);
                    resultDiv.innerHTML = 'カメラへのアクセスに失敗しました: ' + error;
                });

            function tick() {
                if (!scanning) return; // 停止時は抜ける
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: 'dontInvert',
                    });

                    if (code) {
                        resultDiv.innerHTML = 'QRコード: ' + code.data;
                        sendDataToBackend(code.data);
                        // カメラは止めず、一定時間後に再スキャン
                        setTimeout(() => { requestAnimationFrame(tick); }, 1500);
                    } else {
                        requestAnimationFrame(tick);
                    }
                } else {
                    requestAnimationFrame(tick);
                }
            }
        }

        // カメラを止める場合はこの関数を呼ぶ
        function stopQRScanner() {
            scanning = false;
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-canvas');
            video.style.display = 'none';
            canvas.style.display = 'none';
            if (videoStream) {
                const tracks = videoStream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
                videoStream = null;
            }
        }

        function sendDataToBackend(qrCodeData) {
            const resultDiv = document.getElementById('result');
            fetch('/update_device_status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: qrCodeData })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Server response:', data); // デバッグログ追加
                if (data.status === 'success') {
                    resultDiv.innerHTML = `デバイスID: ${data.device.ID} - ステータス: ${data.device.borrowed ? '貸出中' : '返却済み'}`;
                    updateDeviceList();
                    // サウンド再生（パスを修正）
                    const soundPath = data.device.borrowed ? '../sound/Beep01.mp3' : '../sound/Beep02.mp3';
                    playSound(soundPath);

                    // 内カメラで撮影
                    console.log('Calling takeInnerPhoto with deviceId:', data.device.ID); // デバッグログ追加
                    takeInnerPhoto(data.device.ID);

                } else if (data.status === 'not_found') {
                    resultDiv.innerHTML = 'デバイスが見つかりませんでした。';
                    playSound('../sound/Alarm.mp3');
                    // 3秒後に初期メッセージに戻す
                    setTimeout(() => {
                        resultDiv.innerHTML = 'QRコードを読み取らせてください';
                    }, 3000);
                } else {
                    resultDiv.innerHTML = 'エラーが発生しました。';
                    // 3秒後に初期メッセージに戻す
                    setTimeout(() => {
                        resultDiv.innerHTML = 'QRコードを読み取らせてください';
                    }, 3000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = 'エラーが発生しました。';
                // 3秒後に初期メッセージに戻す
                setTimeout(() => {
                    resultDiv.innerHTML = 'QRコードを読み取らせてください';
                }, 3000);
            });
        }

        function playSound(soundPath) {
            const audio = new Audio(soundPath);
            audio.volume = 1.0; // 音量を最大に設定
            
            // エラーハンドリングを追加
            audio.addEventListener('error', function(e) {
                console.error('音声ファイルの再生に失敗しました:', soundPath, e);
            });
            
            audio.addEventListener('canplaythrough', function() {
                console.log('音声ファイルの読み込み完了:', soundPath);
            });
            
            // 音声再生の実行
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log('音声再生開始:', soundPath);
                    })
                    .catch(error => {
                        console.error('音声再生エラー:', error);
                        // ユーザー操作が必要な場合のフォールバック
                        if (error.name === 'NotAllowedError') {
                            console.log('ユーザー操作が必要です。画面をクリックしてから再度お試しください。');
                        }
                    });
            }
        }

        // 内カメラで撮影する関数
        function takeInnerPhoto(deviceId) {
            console.log('takeInnerPhoto called with deviceId:', deviceId); // デバッグログ追加
            
            // camera.jsが既に読み込まれているかチェック
            if (typeof takePhoto === 'function') {
                console.log('takePhoto function found, calling directly'); // デバッグログ追加
                takePhoto(deviceId);
            } else {
                console.log('takePhoto function not found, loading camera.js'); // デバッグログ追加
                // 新しいスクリプト要素を作成
                var script = document.createElement('script');
                script.src = '/static/js/camera.js'; // camera.jsのパス
                script.type = 'text/javascript';
                script.onload = function() {
                    console.log('camera.js loaded, calling takePhoto'); // デバッグログ追加
                    // camera.jsがロードされた後に、takePhoto関数を呼び出す
                    takePhoto(deviceId);
                };
                script.onerror = function() {
                    console.error('Failed to load camera.js'); // エラーログ追加
                };

                // body要素にスクリプト要素を追加
                document.body.appendChild(script);
            }
        }

        // ページロード時に自動でQRスキャナを起動
        window.addEventListener('DOMContentLoaded', function() {
            startQRScanner();
            updateDeviceList(); // 初期表示用
        });
    </script>
    
    <footer style="text-align: center; margin-top: 30px; padding: 20px; background-color: #333; color: #fff;">
        <p>version 1.1.0</p>
        <p>Powered by <span style="color: lightblue;">hisa11</span></p>
        <a href="https://github.com/hisa11/QRmanager" style="color: lightblue; text-decoration: none;" target="_blank">GitHub Repository</a>
    </footer>
</body>
</html>
